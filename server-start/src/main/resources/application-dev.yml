server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&tinyInt1isBit=false&allowLoadLocalInfile=true&allowLocalInfile=true&allowUrlInLocalInfile=true&allowPublicKeyRetrieval=true&allowMultiQueries=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&allowUrlInLocalInfile=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  data:
    redis:
      host: localhost
      port: 6379
  ai:
    openai:
      base-url: https://api.xiaomimimo.com
      api-key: ${AI_API_KEY:sk-your-api-key-here}
      chat:
        options:
          model: mimo-v2-flash

commons:
  sa-token:
    enabled: false
  job:
    xxl:
      enabled: false
      admin-addresses: http://localhost:8090/xxl-job-admin
      access-token: default_token
      appname: server-executor
      port: 9999
      log-retention-days: 30
      timeout: 3
    quartz:
      enabled: true
      scheduler-name: commons-job-scheduler
      retry:
        max-attempts: 3
        delay-ms: 1000
        backoff-multiplier: 2.0
