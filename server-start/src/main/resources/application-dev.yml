server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&tinyInt1isBit=false&allowLoadLocalInfile=true&allowLocalInfile=true&allowUrlInLocalInfile=true&allowPublicKeyRetrieval=true&allowMultiQueries=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&allowUrlInLocalInfile=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

  data:
    redis:
      host: localhost
      port: 6379
  ai:
    openai:
      base-url: https://api.xiaomimimo.com
      api-key: ${AI_API_KEY:sk-your-api-key-here}
      chat:
        options:
          model: mimo-v2-flash

commons:
  sa-token:
    enabled: false
  job:
    xxl:
      enabled: false
      admin-addresses: http://localhost:8090/xxl-job-admin
      access-token: default_token
      appname: server-executor
      port: 9999
      log-retention-days: 30
      timeout: 3
    quartz:
      enabled: true
      scheduler-name: commons-job-scheduler
      retry:
        max-attempts: 3
        delay-ms: 1000
        backoff-multiplier: 2.0

  web:
    crypto:
      enabled: true
      algorithms:
        # AES 对称加密（CBC 模式，PKCS5 填充）
        aes:
          type: AES
          mode: CBC
          padding: PKCS5Padding
          key: MDEyMzQ1Njc4OWFiY2RlZg== # 0123456789abcdef 的 Base64 编码（16 字节）
          iv: MDEyMzQ1Njc4OWFiY2RlZg== # 初始化向量，与 key 相同长度
          encoding: BASE64
        # SM4 对称加密（CBC 模式，PKCS5 填充）
        sm4:
          type: SM4
          mode: CBC
          padding: PKCS5Padding
          key: MDEyMzQ1Njc4OWFiY2RlZg== # 0123456789abcdef 的 Base64 编码（16 字节）
          iv: MDEyMzQ1Njc4OWFiY2RlZg== # 初始化向量，与 key 相同长度
          encoding: BASE64
        # RSA 非对称加密（测试密钥对）
        rsa:
          type: RSA
          public-key: 
          private-key: 
          encoding: BASE64
        # SM2 非对称加密（测试密钥对）
        sm2:
          type: SM2
          public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEYVx9Xd3qRvVAKvaygV2upKy6eqCffWfMoyXuptbAGhIcLl7v9YUZcDkSgmW0/+I82CnjMJ9m1K36hEUoL+YWRA==
          private-key: MEECAQAwEwYHKoZIzj0CAQYIKoZIzj0DAQcEJzAlAgEBBCCwpoMXpvOprbQaOz1a1FYyQkSooZ6pGKT0tHya1UJqvA==
          encoding: BASE64