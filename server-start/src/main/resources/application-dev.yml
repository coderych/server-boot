server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&tinyInt1isBit=false&allowLoadLocalInfile=true&allowLocalInfile=true&allowUrlInLocalInfile=true&allowPublicKeyRetrieval=true&allowMultiQueries=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&allowUrlInLocalInfile=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  # 开发环境默认不启用外部 AI 模型，避免未配置密钥时阻断服务启动。
  ai:
    model:
      chat: none
      embedding: none
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

commons:
  sa-token:
    enabled: true
    super-admins:
      - admin
  job:
    xxl:
      enabled: false
      admin-addresses: http://localhost:8090/xxl-job-admin
      access-token: default_token
      appname: server-executor
      port: 9999
      log-retention-days: 30
      timeout: 3
    quartz:
      enabled: true
      scheduler-name: commons-job-scheduler
      retry:
        max-attempts: 3
        delay-ms: 1000
        backoff-multiplier: 2.0
